<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" fill="none" role="img" aria-label="SnapMealsDaily">
  <!-- Camera-shutter / plate icon -->
  <g transform="translate(4, 4)">
    <!-- Outer ring (plate rim) -->
    <circle cx="20" cy="20" r="18" fill="#FFF8F0" stroke="#E85D1A" stroke-width="1.8"/>
    <!-- Inner plate -->
    <circle cx="20" cy="20" r="13" fill="white" stroke="#E85D1A" stroke-width="0.8" stroke-opacity="0.4"/>
    <!-- Camera aperture blades (6 petals) styled as food -->
    <!-- Petal top -->
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#E85D1A" opacity="0.85" transform="rotate(0 20 20)"/>
    <!-- Petal top-right -->
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#E85D1A" opacity="0.85" transform="rotate(60 20 20)"/>
    <!-- Petal bottom-right -->
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#E85D1A" opacity="0.85" transform="rotate(120 20 20)"/>
    <!-- Petal bottom -->
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#D97706" opacity="0.75" transform="rotate(180 20 20)"/>
    <!-- Petal bottom-left -->
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#D97706" opacity="0.75" transform="rotate(240 20 20)"/>
    <!-- Petal top-left -->
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#D97706" opacity="0.75" transform="rotate(300 20 20)"/>
    <!-- Center lens dot -->
    <circle cx="20" cy="20" r="4.5" fill="#E85D1A"/>
    <circle cx="20" cy="20" r="2" fill="white" fill-opacity="0.9"/>
    <!-- Small camera notch at top -->
    <rect x="17" y="2" width="6" height="2.5" rx="1.25" fill="#E85D1A"/>
  </g>
  <!-- Wordmark -->
  <text font-family="Playfair Display, Georgia, serif" font-size="19.5" font-weight="700" letter-spacing="-0.015em">
    <tspan x="50" y="30" fill="#E85D1A">Snap</tspan><tspan fill="#1a1006">Meals</tspan>
  </text>
  <text font-family="Nunito Sans, ui-sans-serif, sans-serif" font-size="10" font-weight="700" letter-spacing="0.18em" fill="#D97706" x="50" y="43" text-transform="uppercase">DAILY</text>
</svg>
