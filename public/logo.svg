<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 52" fill="none" role="img" aria-label="SnapMealsDaily">

  <!-- ── Icon mark: fork + knife in teal circle ── -->
  <g transform="translate(2, 2)">
    <!-- Outer glow ring -->
    <circle cx="24" cy="24" r="23" fill="rgba(13,148,136,0.12)" stroke="#0d9488" stroke-width="0.6" stroke-opacity="0.4"/>
    <!-- Filled circle background -->
    <circle cx="24" cy="24" r="21" fill="#042f2e"/>
    <!-- Subtle inner ring -->
    <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(45,212,191,0.2)" stroke-width="0.8"/>

    <!-- Fork (left side) — 3 tines + handle -->
    <g stroke="white" stroke-linecap="round" stroke-linejoin="round">
      <!-- Tine 1 -->
      <line x1="16" y1="10" x2="16" y2="18" stroke-width="1.5"/>
      <!-- Tine 2 (center) -->
      <line x1="19" y1="10" x2="19" y2="18" stroke-width="1.5"/>
      <!-- Tine 3 -->
      <line x1="22" y1="10" x2="22" y2="18" stroke-width="1.5"/>
      <!-- Fork neck curve -->
      <path d="M16,18 Q16,22 19,22 Q22,22 22,18" stroke-width="1.5" fill="none"/>
      <!-- Handle -->
      <line x1="19" y1="22" x2="19" y2="38" stroke-width="1.7"/>
    </g>

    <!-- Knife (right side) -->
    <g stroke="white" stroke-linecap="round" stroke-linejoin="round">
      <!-- Blade -->
      <path d="M29,10 C31.5,13 31.5,17 29,20 L29,38" stroke-width="1.6" fill="none"/>
      <!-- Blade edge -->
      <path d="M29,10 C29,10 31.5,13 31.5,17 C31.5,19 30.5,20.5 29,21" stroke-width="0.8" stroke-opacity="0.5" fill="none"/>
    </g>

    <!-- Amber center dot accent -->
    <circle cx="24" cy="24" r="2.2" fill="#f59e0b"/>
    <circle cx="24" cy="24" r="1" fill="rgba(255,255,255,0.9)"/>
  </g>

  <!-- ── Wordmark ── -->
  <!-- "Snap" in teal, "Meals" in near-black -->
  <text font-family="Playfair Display, Georgia, serif" font-size="21" font-weight="700" letter-spacing="-0.02em">
    <tspan x="58" y="31" fill="#0d9488">Snap</tspan><tspan fill="#0a1f1e">Meals</tspan>
  </text>
  <!-- "DAILY" tagline in amber small caps -->
  <text font-family="Nunito Sans, ui-sans-serif, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.22em" fill="#f59e0b" x="59" y="44">DAILY</text>

  <!-- Amber dot separator after DAILY -->
  <circle cx="108" cy="40" r="2" fill="#f59e0b" opacity="0.6"/>
</svg>
