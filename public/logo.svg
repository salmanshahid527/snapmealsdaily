<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" fill="none" role="img" aria-label="SnapMealsDaily">
  <!-- Camera-shutter / plate icon in teal -->
  <g transform="translate(4, 4)">
    <!-- Outer ring (plate rim) -->
    <circle cx="20" cy="20" r="18" fill="#e6f7f6" stroke="#0d9488" stroke-width="1.8"/>
    <!-- Inner plate -->
    <circle cx="20" cy="20" r="13" fill="white" stroke="#0d9488" stroke-width="0.8" stroke-opacity="0.4"/>
    <!-- Aperture blades — teal + amber alternating -->
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#0d9488" opacity="0.9" transform="rotate(0 20 20)"/>
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#0d9488" opacity="0.9" transform="rotate(60 20 20)"/>
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#0d9488" opacity="0.9" transform="rotate(120 20 20)"/>
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#f59e0b" opacity="0.85" transform="rotate(180 20 20)"/>
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#f59e0b" opacity="0.85" transform="rotate(240 20 20)"/>
    <ellipse cx="20" cy="11" rx="2.2" ry="4" fill="#f59e0b" opacity="0.85" transform="rotate(300 20 20)"/>
    <!-- Center lens -->
    <circle cx="20" cy="20" r="4.5" fill="#0d9488"/>
    <circle cx="20" cy="20" r="2" fill="white" fill-opacity="0.9"/>
    <!-- Camera notch -->
    <rect x="17" y="2" width="6" height="2.5" rx="1.25" fill="#0d9488"/>
  </g>
  <!-- Wordmark -->
  <text font-family="Playfair Display, Georgia, serif" font-size="19.5" font-weight="700" letter-spacing="-0.015em">
    <tspan x="50" y="30" fill="#0d9488">Snap</tspan><tspan fill="#0a1f1e">Meals</tspan>
  </text>
  <text font-family="Nunito Sans, ui-sans-serif, sans-serif" font-size="10" font-weight="700" letter-spacing="0.18em" fill="#f59e0b" x="50" y="43">DAILY</text>
</svg>
