<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded square background — dark teal -->
  <rect width="32" height="32" rx="7" fill="#042f2e"/>
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="30" height="30" rx="6.2" fill="none" stroke="rgba(45,212,191,0.2)" stroke-width="0.8"/>

  <!-- Fork (left) -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tine 1 -->
    <line x1="9.5" y1="6.5" x2="9.5" y2="13" stroke-width="1.4"/>
    <!-- Tine 2 -->
    <line x1="12" y1="6.5" x2="12" y2="13" stroke-width="1.4"/>
    <!-- Tine 3 -->
    <line x1="14.5" y1="6.5" x2="14.5" y2="13" stroke-width="1.4"/>
    <!-- Neck curve -->
    <path d="M9.5,13 Q9.5,16.5 12,16.5 Q14.5,16.5 14.5,13" stroke-width="1.4" fill="none"/>
    <!-- Handle -->
    <line x1="12" y1="16.5" x2="12" y2="25.5" stroke-width="1.6"/>
  </g>

  <!-- Knife (right) -->
  <g stroke="white" stroke-linecap="round">
    <!-- Blade + handle in one path -->
    <path d="M20,6.5 C22,9 22,13 20,15.5 L20,25.5" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <!-- Blade curve detail -->
    <path d="M20,6.5 C20,6.5 22,9 22,13" stroke-width="0.7" stroke-opacity="0.4" fill="none"/>
  </g>

  <!-- Amber dot center accent -->
  <circle cx="16" cy="16" r="2.5" fill="#f59e0b"/>
  <circle cx="16" cy="16" r="1.1" fill="white" fill-opacity="0.9"/>
</svg>
