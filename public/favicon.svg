<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background — dark teal -->
  <rect width="32" height="32" rx="8" fill="#042f2e"/>
  <!-- Plate outer ring -->
  <circle cx="16" cy="17" r="12" fill="#e6f7f6" stroke="#0d9488" stroke-width="1.2"/>
  <!-- Plate inner -->
  <circle cx="16" cy="17" r="8.5" fill="white" stroke="#0d9488" stroke-width="0.6" stroke-opacity="0.35"/>
  <!-- Aperture blades — teal + amber -->
  <ellipse cx="16" cy="10" rx="1.6" ry="3.2" fill="#0d9488" opacity="0.9" transform="rotate(0 16 17)"/>
  <ellipse cx="16" cy="10" rx="1.6" ry="3.2" fill="#0d9488" opacity="0.9" transform="rotate(60 16 17)"/>
  <ellipse cx="16" cy="10" rx="1.6" ry="3.2" fill="#0d9488" opacity="0.9" transform="rotate(120 16 17)"/>
  <ellipse cx="16" cy="10" rx="1.6" ry="3.2" fill="#f59e0b" opacity="0.85" transform="rotate(180 16 17)"/>
  <ellipse cx="16" cy="10" rx="1.6" ry="3.2" fill="#f59e0b" opacity="0.85" transform="rotate(240 16 17)"/>
  <ellipse cx="16" cy="10" rx="1.6" ry="3.2" fill="#f59e0b" opacity="0.85" transform="rotate(300 16 17)"/>
  <!-- Center -->
  <circle cx="16" cy="17" r="3.2" fill="#0d9488"/>
  <circle cx="16" cy="17" r="1.3" fill="white" fill-opacity="0.9"/>
  <!-- Camera notch -->
  <rect x="13.5" y="3.5" width="5" height="2" rx="1" fill="#0d9488"/>
</svg>
